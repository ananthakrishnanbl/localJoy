<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#e6f4fb">
    <title>localJoy – Controller</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/controller.css">
    <script src="/vendor/peerjs.min.js"></script>
</head>
<body>

    <!-- Screen 1: join -->
    <main id="joinScreen" class="screen join">
        <div class="logo" aria-label="localJoy"><i>l</i><i>o</i><i>c</i><i>a</i><i>l</i><i>J</i><i>o</i><i>y</i></div>
        <h1>Join the game</h1>

        <div class="card">
            <label>
                Room code
                <input id="roomInput" class="code" maxlength="5" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text" placeholder="AB7KQ">
            </label>
            <label>
                Your name
                <input id="nameInput" maxlength="12" autocomplete="off" placeholder="Player">
            </label>
        </div>

        <button id="joinBtn" class="toy primary">Join game</button>
        <p id="status" role="status"></p>
    </main>

    <!-- Screen 2: controller -->
    <main id="padScreen" class="screen padscreen" hidden>
        <header class="topbar">
            <div class="me">
                <span class="avatar" id="meAvatar">P</span>
                <span id="meName">Player</span>
                <span class="host-badge" id="hostBadge" title="Host" hidden>👑</span>
            </div>
            <!-- Game status (health, kills...). Shown only when a game sends it -->
            <div class="hud" id="hud" hidden>
                <div class="hp" id="hpWrap"><i id="hpFill"></i></div>
                <span id="hudText"></span>
            </div>
            <div class="room">
                <span id="roomLabel">00000</span>
                <span class="dot" id="dot" title="Connection"></span>
            </div>
            <button class="exit" id="exitBtn" hidden>Exit</button>
            <button class="fs" id="fsBtn" aria-label="Fullscreen" title="Fullscreen" hidden>⛶</button>
        </header>

        <!-- Shown instead of the pad while there is nothing to control -->
        <section class="panel" id="panel">
            <div class="panel-card">
                <div class="panel-icon" id="panelIcon">🎮</div>
                <h2 id="panelTitle">You're in!</h2>
                <p id="panelText">Waiting for the host…</p>
                <button id="readyBtn" class="toy primary" hidden>Ready!</button>
            </div>
        </section>

        <!-- Pad area: controller.js builds the right controller into #padHost (see /js/pad/) -->
        <div class="pad-area" id="padArea" hidden>
            <section class="pad" id="padHost"></section>
            <div class="down" id="down" hidden>Respawning…</div>
        </div>

        <div id="overlay" class="overlay" hidden>
            <div class="card">
                <p id="overlayMsg">Disconnected from the game.</p>
                <button id="retryBtn" class="toy primary">Rejoin</button>
            </div>
        </div>
    </main>

    <script type="module" src="/js/controller.js"></script>
</body>
</html>

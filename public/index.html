<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>localJoy – Game console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">
    <script src="/vendor/peerjs.min.js"></script>
    <script>
        if (window.innerWidth <= 768) {
            window.location.href = "/controller.html";
        }
    </script>
</head>
<body>
    <header class="navbar">
        <a class="logo" href="/" aria-label="localJoy"><i>l</i><i>o</i><i>c</i><i>a</i><i>l</i><i>J</i><i>o</i><i>y</i></a>
        <div class="nav-right">
            <button class="chip room-chip" id="navCopy" title="Copy room code">
                <span aria-hidden="true">🔗</span><span class="room-code">·····</span>
            </button>
            <button class="chip icon-chip" id="fullscreenBtn" title="Fullscreen" aria-label="Fullscreen">
                <span id="fsIcon" aria-hidden="true">⛶</span>
            </button>
        </div>
    </header>

    <aside class="sidebar">
        <h2>Players <span id="playerCount">0</span></h2>
        <ul id="playerList"></ul>
    </aside>

    <main class="lobby" id="lobbyScreen">
        <section class="connect">
            <p class="connect-title">
                <span class="highlight">Connect controllers</span>
                Type the code on your phone or scan the QR code
            </p>

            <button class="room-id" id="roomCopy" title="Click to copy" aria-label="Copy room code">
                <span class="blocks" id="blocks" aria-live="polite"></span>
            </button>
            <span class="copied" id="copiedMsg" role="status">Code copied!</span>

            <p class="or"><span>or</span></p>

            <div class="qr" id="qr"></div>

            <p class="host-hint" id="hostHint" role="status"></p>
        </section>
    </main>

    <!-- Select game page (shown after the host taps Ready) -->
    <main class="select" id="selectScreen" hidden>
        <section class="feature" id="feature">
            <div class="info">
                <h1 id="fTitle"></h1>
                <p class="tagline" id="fTagline"></p>
                <div class="meta">
                    <span class="stars" id="fStars"></span>
                    <span class="pill" id="fPlayers"></span>
                    <span class="pill" id="fControls"></span>
                </div>
                <p class="desc" id="fDesc"></p>
                <div class="meta" id="fTags"></div>
                <p class="warn" id="fWarn" role="status"></p>
            </div>
            <div class="art" id="fArt"></div>
        </section>

        <section class="shelf">
            <h2>All games</h2>
            <div class="row" id="gameRow"></div>
        </section>

        <div class="hintbar">
            <span><i class="key stick">✥</i> Move the joystick to browse</span>
            <span>Click <i class="key a">A</i> to select</span>
            <span><i class="key b">B</i> Back</span>
            <span id="whoHint"></span>
        </div>
    </main>

    <!-- Game screen: console.js loads the chosen game module into #gameRoot -->
    <main class="game" id="gameScreen" hidden>
        <div id="gameRoot"></div>
    </main>
    <script type="module" src="/js/console.js"></script>
    <script type="module" src="/js/select.js"></script>
</body>
</html>

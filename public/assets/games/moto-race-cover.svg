<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b57"/>
      <stop offset="0.55" stop-color="#ff9f5a"/>
      <stop offset="1" stop-color="#ffd58a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f58"/>
      <stop offset="1" stop-color="#2d3138"/>
    </linearGradient>
  </defs>

  <!-- sky and sun -->
  <rect width="512" height="512" fill="url(#sky)"/>
  <circle cx="256" cy="236" r="64" fill="#fff0b3" opacity="0.95"/>

  <!-- mountains -->
  <polygon points="0,262 70,150 130,230 180,170 250,262" fill="#7d6a66"/>
  <polygon points="262,262 340,140 400,220 450,168 512,262" fill="#6f5d5a"/>
  <polygon points="70,150 52,178 70,170 84,182" fill="#fff"/>
  <polygon points="340,140 318,176 340,166 358,180" fill="#fff"/>
  <polygon points="450,168 436,190 450,184 462,194" fill="#fff"/>
  <polygon points="180,170 168,190 180,184 192,192" fill="#fff"/>

  <!-- sand -->
  <rect y="262" width="512" height="250" fill="#e0c68a"/>
  <g fill="#c9a96a" opacity="0.55">
    <ellipse cx="60" cy="330" rx="40" ry="4"/><ellipse cx="450" cy="360" rx="50" ry="5"/>
    <ellipse cx="90" cy="450" rx="60" ry="6"/><ellipse cx="440" cy="470" rx="60" ry="6"/>
  </g>

  <!-- road, kerbs, centre dashes -->
  <polygon points="246,262 266,262 420,512 92,512" fill="url(#road)"/>
  <polygon points="246,262 241,262 80,512 92,512" fill="#f2f2f2"/>
  <polygon points="266,262 271,262 432,512 420,512" fill="#f2f2f2"/>
  <g fill="#ffd34d">
    <polygon points="253.8,285 258.2,285 258.6,300 253.4,300"/>
    <polygon points="252.8,320 259.2,320 260,345 252,345"/>
    <polygon points="251.1,375 260.9,375 262.1,415 249.9,415"/>
    <polygon points="248.8,450 263.2,450 265,512 247,512"/>
  </g>

  <!-- speed streaks -->
  <g stroke="#fff" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="60" y1="400" x2="20" y2="470"/><line x1="100" y1="350" x2="76" y2="392"/>
    <line x1="452" y1="400" x2="492" y2="470"/><line x1="412" y1="350" x2="436" y2="392"/>
  </g>

  <!-- cube bike seen from behind -->
  <ellipse cx="256" cy="476" rx="64" ry="10" fill="#000" opacity="0.3"/>
  <rect x="236" y="462" width="40" height="16" rx="4" fill="#1b2128"/>
  <polygon points="216,395 296,395 284,370 228,370" fill="#ff7a7a"/>
  <rect x="216" y="395" width="80" height="70" fill="#ff4d4d"/>
  <rect x="216" y="395" width="80" height="8" fill="#e03a3a"/>
  <polygon points="244,374 268,374 264,382 248,382" fill="#fff"/>
  <rect x="246" y="430" width="20" height="10" rx="3" fill="#ffd34d"/>
</svg>

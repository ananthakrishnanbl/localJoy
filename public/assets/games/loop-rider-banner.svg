<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Loop Rider banner">
  <defs>
    <radialGradient id="lrbgb" cx="50%" cy="45%" r="80%">
      <stop offset="0%" stop-color="#16202e"/>
      <stop offset="100%" stop-color="#080b11"/>
    </radialGradient>
    <linearGradient id="lrloopb" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fdcff"/>
      <stop offset="100%" stop-color="#3ecf6e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="400" fill="url(#lrbgb)"/>

  <!-- left: the loop with an arrow on it -->
  <g transform="translate(300 200)">
    <path d="M0 -130
             C90 -126 132 -54 122 20
             C112 96 40 140 -30 132
             C-104 124 -140 66 -136 -6
             C-132 -84 -84 -132 0 -130 Z"
          fill="none" stroke="url(#lrloopb)" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="0" cy="-130" r="7" fill="#ffffff" opacity=".7"/>
    <g transform="translate(0 -130) rotate(30)">
      <polygon points="24,0 -16,-15 -8,0 -16,15" fill="#ff8a3d"/>
    </g>
  </g>

  <!-- right: title + tagline -->
  <g fill="#eaf2ff" font-family="system-ui, sans-serif">
    <text x="620" y="170" font-size="72" font-weight="800" letter-spacing="4">LOOP RIDER</text>
    <text x="620" y="222" font-size="26" font-weight="600" fill="#8fb8d8">
      Tap left, tap right. Trace the line.
    </text>
    <text x="620" y="266" font-size="20" font-weight="500" fill="#6f8ba1">
      Every tap nudges your heading — stay on the loop.
    </text>
  </g>
</svg>
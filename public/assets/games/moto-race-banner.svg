<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b57"/>
      <stop offset="0.6" stop-color="#ff9f5a"/>
      <stop offset="1" stop-color="#ffd58a"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f58"/>
      <stop offset="1" stop-color="#2d3138"/>
    </linearGradient>
  </defs>

  <!-- sky and sun -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  <circle cx="640" cy="330" r="130" fill="#fff0b3" opacity="0.95"/>

  <!-- mountains -->
  <polygon points="0,360 150,170 270,300 380,200 520,360" fill="#7d6a66"/>
  <polygon points="760,360 900,160 1010,290 1120,190 1280,360" fill="#6f5d5a"/>
  <polygon points="440,360 560,250 640,330 720,260 820,360" fill="#8b7773"/>
  <g fill="#fff">
    <polygon points="150,170 118,218 150,206 178,224"/>
    <polygon points="380,200 356,238 380,230 402,242"/>
    <polygon points="900,160 862,218 900,204 934,224"/>
    <polygon points="1120,190 1094,230 1120,222 1142,234"/>
  </g>

  <!-- sand -->
  <rect y="360" width="1280" height="360" fill="#e0c68a"/>
  <g fill="#c9a96a" opacity="0.55">
    <ellipse cx="160" cy="450" rx="110" ry="8"/><ellipse cx="1090" cy="480" rx="130" ry="9"/>
    <ellipse cx="220" cy="620" rx="160" ry="11"/><ellipse cx="1060" cy="650" rx="170" ry="12"/>
  </g>

  <!-- road, kerbs, centre dashes -->
  <polygon points="626,360 654,360 970,720 310,720" fill="url(#road)"/>
  <polygon points="626,360 618,360 292,720 310,720" fill="#f2f2f2"/>
  <polygon points="654,360 662,360 988,720 970,720" fill="#f2f2f2"/>
  <g fill="#ffd34d">
    <polygon points="637,395 643,395 644,415 636,415"/>
    <polygon points="635.5,445 644.5,445 645.8,480 634.2,480"/>
    <polygon points="633.5,525 646.5,525 648.5,580 631.5,580"/>
    <polygon points="630,640 650,640 653,720 627,720"/>
  </g>

  <!-- speed streaks -->
  <g stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.55">
    <line x1="140" y1="560" x2="60" y2="700"/><line x1="260" y1="480" x2="210" y2="560"/>
    <line x1="1140" y1="560" x2="1220" y2="700"/><line x1="1020" y1="480" x2="1070" y2="560"/>
  </g>

  <!-- cube bike seen from behind -->
  <ellipse cx="640" cy="652" rx="130" ry="18" fill="#000" opacity="0.3"/>
  <rect x="600" y="626" width="80" height="30" rx="8" fill="#1b2128"/>
  <polygon points="560,500 720,500 696,452 584,452" fill="#ff7a7a"/>
  <rect x="560" y="500" width="160" height="136" fill="#ff4d4d"/>
  <rect x="560" y="500" width="160" height="14" fill="#e03a3a"/>
  <polygon points="612,458 668,458 662,474 618,474" fill="#fff"/>
  <rect x="612" y="560" width="56" height="20" rx="6" fill="#ffd34d"/>
</svg>
